<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <!-- 原創圖示：4×4 棋盤格＋金色「騎士跳步」路線（先直走兩格，再橫走一格），冇用任何品牌圖案 -->
  <rect width="512" height="512" fill="#262522"/>
  <g>
    <rect x="0"   y="0"   width="128" height="128" fill="#eeeed2"/><rect x="128" y="0"   width="128" height="128" fill="#769656"/>
    <rect x="256" y="0"   width="128" height="128" fill="#eeeed2"/><rect x="384" y="0"   width="128" height="128" fill="#769656"/>
    <rect x="0"   y="128" width="128" height="128" fill="#769656"/><rect x="128" y="128" width="128" height="128" fill="#eeeed2"/>
    <rect x="256" y="128" width="128" height="128" fill="#769656"/><rect x="384" y="128" width="128" height="128" fill="#eeeed2"/>
    <rect x="0"   y="256" width="128" height="128" fill="#eeeed2"/><rect x="128" y="256" width="128" height="128" fill="#769656"/>
    <rect x="256" y="256" width="128" height="128" fill="#eeeed2"/><rect x="384" y="256" width="128" height="128" fill="#769656"/>
    <rect x="0"   y="384" width="128" height="128" fill="#769656"/><rect x="128" y="384" width="128" height="128" fill="#eeeed2"/>
    <rect x="256" y="384" width="128" height="128" fill="#769656"/><rect x="384" y="384" width="128" height="128" fill="#eeeed2"/>
  </g>
  <!-- 深色外框令金色路線喺淺色同深色格都夠清楚 -->
  <g fill="none" stroke-linecap="round" stroke-linejoin="round">
    <path d="M192 448 V192 H352" stroke="#262522" stroke-width="84"/>
    <path d="M192 448 V192 H352" stroke="#e8bd4f" stroke-width="44"/>
  </g>
  <path d="M330 120 L440 192 L330 264 Z" fill="#262522" stroke="#262522" stroke-width="30" stroke-linejoin="round"/>
  <path d="M330 120 L440 192 L330 264 Z" fill="#e8bd4f"/>
  <circle cx="192" cy="448" r="46" fill="#262522"/><circle cx="192" cy="448" r="28" fill="#e8bd4f"/>
</svg>
