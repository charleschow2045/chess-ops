<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>棋盤測試：自己寫</title>
<link rel="stylesheet" href="css/test.css">
<link rel="stylesheet" href="css/board-custom.css">
<link rel="stylesheet" href="vendor/chessground/chessground.cburnett.css">
</head>
<body>
<div class="page">
  <div class="topbar"><a class="btn-back" href="./">‹ 返回</a></div>
  <h1>棋盤測試 B：自己寫</h1>
  <p class="muted">CSS grid + Pointer Events，約 200 行 JavaScript（js/board-custom.js）。請試：點棋子再點格子、拖拉、升變（用 a7 兵走到 a8）、翻轉棋盤。</p>

  <div class="status" id="status"></div>
  <div class="board-box"><div id="board"></div></div>
  <div class="row">
    <button class="btn" id="flip">翻轉棋盤</button>
    <button class="btn" id="undo">悔棋</button>
    <button class="btn" id="reset">重新開始</button>
    <button class="btn" id="promoPos">載入升變局面</button>
    <button class="btn" id="arrow">畫箭咀（示範）</button>
  </div>
  <div class="moves" id="moves"></div>
  <p class="muted" id="perf"></p>
</div>

<script src="js/ui-common.js"></script>
<script src="js/board-custom.js"></script>
<script type="module">
import { Chess } from "./vendor/chess.js/chess.esm.js";

const { UI, CustomBoard } = window.ChessOps;
const game = new Chess();
const $ = id => document.getElementById(id);

function refresh() {
  $("status").textContent = UI.statusText(game);
  $("moves").textContent = UI.movesText(game.history());
}
const board = new CustomBoard($("board"), {
  game, askPromotion: UI.askPromotion,
  onMove() { refresh(); }
});
refresh();

$("flip").onclick = () => board.flip();
$("undo").onclick = () => {
  game.undo(); const h = game.history({ verbose: true }); const l = h[h.length - 1];
  board.last = l ? [l.from, l.to] : null; board.selected = null; board.clearArrows(); board.render(); refresh();
};
$("reset").onclick = () => { game.reset(); board.last = null; board.selected = null; board.clearArrows(); board.render(); refresh(); };
$("promoPos").onclick = () => { game.load("8/P5k1/8/8/8/8/6K1/8 w - - 0 1"); board.last = null; board.selected = null; board.clearArrows(); board.render(); refresh(); };
$("arrow").onclick = () => {
  const mv = game.moves({ verbose: true })[0];
  if (mv) { board.drawArrow(mv.from, mv.to, "#15781b"); board.drawArrow("e4", "e5", "#bb2020"); }
};
</script>
</body>
</html>
