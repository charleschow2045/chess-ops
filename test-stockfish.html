<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<link rel="icon" type="image/svg+xml" href="favicon.svg">
<title>Stockfish 測試</title>
<link rel="stylesheet" href="css/test.css">
</head>
<body>
<div class="page">
  <div class="topbar"><a class="btn-back" href="./">‹ 返回</a></div>
  <h1>Stockfish 引擎測試</h1>
  <p class="muted">Stockfish.js 19 lite 單執行緒（Web Worker）。請用 iPad 撳「全部測試」，等數十秒，然後撳「複製結果」貼俾我。</p>

  <div class="row">
    <button class="btn primary" id="runAll">全部測試</button>
    <button class="btn" id="load">① 載入引擎</button>
    <button class="btn" id="best">② 最佳步</button>
    <button class="btn" id="levels">③ pickMove 全部級別</button>
    <button class="btn" id="copy">複製結果</button>
  </div>

  <div class="card" id="env"></div>
  <h2>載入時間</h2>
  <div class="card" id="loadResult">未測試</div>
  <h2>最佳步（Stockfish 全力，depth 10）</h2>
  <div id="bestResult"><p class="muted">未測試</p></div>
  <h2>pickMove 各級別（每級 5 次，開局＋中局）</h2>
  <div id="levelResult"><p class="muted">未測試</p></div>
  <h2>記錄</h2>
  <pre class="log" id="log"></pre>
</div>

<script src="js/positions.js"></script>
<script src="js/config.js"></script>
<script src="js/pickmove.js"></script>
<script src="js/engine.js"></script>
<script type="module">
import { Chess } from "./vendor/chess.js/chess.esm.js";

const { Engine, POSITIONS, PickMove } = window.ChessOps;
const $ = id => document.getElementById(id);
const ENGINE_URL = "vendor/stockfish/stockfish-19-lite-single.js";
const results = { env: {}, load: null, best: [], levels: [] };
let engine = null;

function log(s) { $("log").textContent += s + "\n"; $("log").scrollTop = 1e9; }
const stats = a => a.length ? { min: Math.min(...a), avg: Math.round(a.reduce((x, y) => x + y, 0) / a.length), max: Math.max(...a) } : null;

results.env = {
  userAgent: navigator.userAgent, cores: navigator.hardwareConcurrency || "?", memoryGB: navigator.deviceMemory || "?",
  screen: screen.width + "×" + screen.height + " @" + devicePixelRatio + "x", viewport: innerWidth + "×" + innerHeight,
  wasm: typeof WebAssembly === "object", crossOriginIsolated: self.crossOriginIsolated === true
};
$("env").innerHTML = "<b>環境</b><br>" + Object.entries(results.env).map(([k, v]) => k + "：" + v).join("<br>");

async function load() {
  if (engine) { engine.terminate(); engine = null; }
  log("載入引擎…");
  const e = new Engine(ENGINE_URL);
  const t = await e.init();
  engine = e;
  const size = await fetch("vendor/stockfish/stockfish-19-lite-single.wasm").then(r => r.blob()).then(b => b.size).catch(() => 0);   // 載入完之後先量，唔影響計時
  const uciOpts = ["Skill Level", "UCI_LimitStrength", "UCI_Elo", "Hash", "Threads"].map(n => (t.options.find(o => o.startsWith("option name " + n + " ")) || n + "（未找到）").replace("option name ", ""));
  results.load = { wasmBytes: size, workerStartMs: t.workerStartMs, uciokMs: t.uciokMs, readyMs: t.readyMs, options: uciOpts };
  $("loadResult").innerHTML = "wasm 大小：" + (size / 1048576).toFixed(2) + " MB<br>Worker 建立：" + t.workerStartMs + " ms<br>引擎 uciok：" + t.uciokMs + " ms<br>引擎 readyok（可以用）：<b>" + t.readyMs + " ms</b><br><span class='muted'>" + uciOpts.join("<br>") + "</span>";
  log("引擎就緒：" + t.readyMs + " ms");
}

async function best() {
  if (!engine) await load();
  const sets = [["開局", POSITIONS.start], ["中局", POSITIONS.middlegame], ["謎題局面", POSITIONS.puzzleFork]];
  results.best = [];
  for (const [name, fen] of sets) {
    const times = [], moves = [];
    for (let i = 0; i < 3; i++) {
      const uci = await engine.bestMove(fen, { depth: 10 });
      times.push(engine.lastInfo.ms); moves.push(uci);
      if (i === 0) results.best.push({ name, fen, firstMs: engine.lastInfo.ms, nodes: engine.lastInfo.nodes });
    }
    const row = results.best[results.best.length - 1];
    row.ms = stats(times); row.move = moves[0];
    log(name + "：" + moves[0] + "，" + times.join("/") + " ms");
  }
  $("bestResult").innerHTML = "<table class='res'><tr><th>局面</th><th>最佳步</th><th>首次 ms</th><th>3 次 最短/平均/最長</th><th>節點</th></tr>" +
    results.best.map(r => `<tr><td>${r.name}</td><td>${r.move}</td><td>${r.firstMs}</td><td>${r.ms.min}/${r.ms.avg}/${r.ms.max}</td><td>${r.nodes}</td></tr>`).join("") + "</table>";
}

async function levels() {
  if (!engine) await load();
  const rows = [];
  for (let level = 1; level <= 8; level++) {
    const times = [], sources = {};
    for (const fen of [POSITIONS.start, POSITIONS.middlegame]) {
      for (let i = 0; i < 5; i++) {
        const game = new Chess(fen), t0 = performance.now();
        const r = await PickMove.pickMove(level, game, { Chess, engine });
        times.push(Math.round(performance.now() - t0));
        const legal = game.moves({ verbose: true }).some(m => m.from === r.move.from && m.to === r.move.to);
        if (!legal) log("⚠ 級別 " + level + " 非法步！");
        sources[r.source] = (sources[r.source] || 0) + 1;
      }
    }
    rows.push({ level, ms: stats(times), sources });
    log("級別 " + level + "：" + JSON.stringify(sources) + " " + stats(times).avg + " ms 平均");
  }
  results.levels = rows;
  $("levelResult").innerHTML = "<table class='res'><tr><th>級別</th><th>最短/平均/最長 ms</th><th>步來源</th></tr>" +
    rows.map(r => `<tr><td>${r.level}</td><td>${r.ms.min}/${r.ms.avg}/${r.ms.max}</td><td>${Object.entries(r.sources).map(([k, v]) => k + "×" + v).join(" ")}</td></tr>`).join("") + "</table>";
}

async function guard(fn) {
  document.querySelectorAll("button").forEach(b => b.disabled = true);
  try { await fn(); } catch (e) { log("❌ 出錯：" + (e && e.message || e)); }
  document.querySelectorAll("button").forEach(b => b.disabled = false);
}
$("load").onclick = () => guard(load);
$("best").onclick = () => guard(best);
$("levels").onclick = () => guard(levels);
$("runAll").onclick = () => guard(async () => { await load(); await best(); await levels(); log("全部完成"); window.__done = true; });
$("copy").onclick = async () => {
  const text = JSON.stringify(results, null, 1);
  try { await navigator.clipboard.writeText(text); log("已複製結果"); }
  catch (e) { $("log").textContent = text; log("\n（無法自動複製，請手動長按選取上面文字）"); }
};
window.__results = results;
</script>
</body>
</html>
