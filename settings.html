<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<link rel="icon" type="image/svg+xml" href="favicon.svg">
<title>設定</title>
<link rel="stylesheet" href="css/theme.css">
<style>
  .set-row { display: flex; align-items: center; gap: 16px; min-height: 72px; padding: 14px 18px; border-radius: var(--radius); background: var(--surface); box-shadow: var(--shadow); cursor: pointer; }
  .set-row b { display: block; font-size: 18px; }
  .set-row span.desc { display: block; font-size: 14px; color: var(--muted); margin-top: 2px; }
  .set-row .txt { flex: 1; }
  .switch { width: 64px; height: 36px; flex: none; accent-color: var(--accent); }
  .bk textarea { width: 100%; min-height: 110px; font-size: 14px; border-radius: 10px; padding: 8px; background: var(--surface2); color: var(--text); border: 1px solid var(--line); box-sizing: border-box; }
  .bk input[type=file] { width: 100%; font-size: 15px; margin: 8px 0; }
  .speed-row { padding: 14px 18px; border-radius: var(--radius); background: var(--surface); box-shadow: var(--shadow); margin-top: 12px; }
  .speed-row b { display: block; font-size: 18px; }
  .speed-row .desc { display: block; font-size: 14px; color: var(--muted); margin: 2px 0 10px; }
  .speed-btns { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; }
  .speed-btns button { min-height: 56px; border-radius: 12px; border: 2px solid var(--line); background: var(--surface2); color: var(--text); font-size: 18px; font-weight: 800; cursor: pointer; }
  .speed-btns button[aria-pressed="true"] { border-color: var(--accent); background: var(--accent); color: var(--accent-fg); }
  .msg { margin: 10px 0 0; font-size: 15px; font-weight: 700; }
  .msg.bad { color: var(--danger); }
  .msg.good { color: var(--accent); }
</style>
</head>
<body>
<main class="page">
  <div class="topbar"><a class="btn-back" href="./">‹ 返回</a><h1>設定</h1></div>
  <label class="set-row">
    <span class="txt"><b>顯示格名</b><span class="desc">開啟後，棋盤每一格都會顯示小寫格名（例如 e4）。預設關閉，棋盤邊永遠有 a–h、1–8 座標。</span></span>
    <input class="switch" type="checkbox" id="square-names" role="switch">
  </label>
  <label class="set-row" style="margin-top:12px">
    <span class="txt"><b>對局中顯示三問提醒</b><span class="desc">輪到你走棋時，棋盤上方顯示一行提示：先想三問（對方想做甚麼？我有機會嗎？這步安全嗎？）。只是提醒，不會替你判斷。預設開啟。</span></span>
    <input class="switch" type="checkbox" id="three-reminder" role="switch">
  </label>
  <div class="speed-row">
    <b>電腦出棋速度</b>
    <span class="desc">電腦（以及戰術謎題、開局、殘局的對手步）走棋前的停頓同棋子移動速度。慢：停 1.2–1.8 秒；中：0.8–1.2 秒；快：0.4–0.8 秒。你自己走棋的速度不受影響。預設：慢。</span>
    <div class="speed-btns" role="group" aria-label="電腦出棋速度">
      <button type="button" data-speed="slow">慢</button>
      <button type="button" data-speed="medium">中</button>
      <button type="button" data-speed="fast">快</button>
    </div>
  </div>
  <p class="muted" id="saved" aria-live="polite"></p>
  <h2 class="section-title">備份與還原</h2>
  <div class="card bk">
    <p style="margin:0 0 6px">目前資料大約佔用 <b id="data-size">—</b>（只儲存在這部裝置的瀏覽器內）。</p>
    <p class="muted" style="margin:0 0 10px">iPad 的瀏覽器可能會清除很久沒有使用的網站資料，建議定期匯出備份。下載後可在「檔案」App 的「下載項目」找到；如果無法下載，請用「複製備份文字」。</p>
    <div class="btn-row">
      <button class="btn primary" id="export" type="button">匯出備份</button>
      <button class="btn" id="copy-backup" type="button">複製備份文字</button>
    </div>
    <h3 style="margin:16px 0 6px;font-size:17px">匯入備份</h3>
    <input type="file" id="import-file" accept=".json,application/json">
    <textarea id="import-text" placeholder="或者在這裡貼上備份文字" aria-label="貼上備份文字"></textarea>
    <div class="btn-row"><button class="btn" id="import-go" type="button">檢查並匯入</button></div>
    <p class="msg" id="backup-msg" role="status" aria-live="polite"></p>
  </div>
</main>
<script src="js/util.js"></script>
<script src="js/state.js"></script>
<script src="js/dialog.js"></script>
<script src="js/settings.js"></script>
</body>
</html>
