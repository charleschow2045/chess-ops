<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<link rel="icon" type="image/svg+xml" href="favicon.svg">
<title>設定</title>
<link rel="stylesheet" href="css/theme.css">
<style>
  .set-row { display: flex; align-items: center; gap: 16px; min-height: 72px; padding: 14px 18px; border-radius: var(--radius); background: var(--surface); box-shadow: var(--shadow); cursor: pointer; }
  .set-row b { display: block; font-size: 18px; }
  .set-row span.desc { display: block; font-size: 14px; color: var(--muted); margin-top: 2px; }
  .set-row .txt { flex: 1; }
  .switch { width: 64px; height: 36px; flex: none; accent-color: var(--accent); }
</style>
</head>
<body>
<main class="page">
  <div class="topbar"><a class="btn-back" href="./">‹ 返回</a><h1>設定</h1></div>
  <label class="set-row">
    <span class="txt"><b>顯示格名</b><span class="desc">開啟後，棋盤每一格都會顯示小寫格名（例如 e4）。預設關閉，棋盤邊永遠有 a–h、1–8 座標。</span></span>
    <input class="switch" type="checkbox" id="square-names" role="switch">
  </label>
  <p class="muted" id="saved" aria-live="polite"></p>
</main>
<script src="js/state.js"></script>
<script src="js/settings.js"></script>
</body>
</html>
