<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>棋盤測試：Chessground</title>
<link rel="stylesheet" href="css/test.css">
<link rel="stylesheet" href="vendor/chessground/chessground.base.css">
<link rel="stylesheet" href="vendor/chessground/chessground.brown.css">
<link rel="stylesheet" href="vendor/chessground/chessground.cburnett.css">
</head>
<body>
<div class="page">
  <div class="topbar"><a class="btn-back" href="./">‹ 返回</a></div>
  <h1>棋盤測試 A：Chessground</h1>
  <p class="muted">Lichess 使用嘅棋盤程式庫（GPL-3.0-or-later）。請試：點棋子再點格子、拖拉、升變（用 a7 兵走到 a8）、翻轉棋盤。</p>

  <div class="status" id="status"></div>
  <div class="board-box"><div id="board"></div></div>
  <div class="row">
    <button class="btn" id="flip">翻轉棋盤</button>
    <button class="btn" id="undo">悔棋</button>
    <button class="btn" id="reset">重新開始</button>
    <button class="btn" id="promoPos">載入升變局面</button>
    <button class="btn" id="arrow">畫箭咀（示範）</button>
  </div>
  <div class="moves" id="moves"></div>
  <p class="muted" id="perf"></p>
</div>

<script src="js/ui-common.js"></script>
<script type="module">
import { Chessground } from "./vendor/chessground/chessground.min.js";
import { Chess } from "./vendor/chess.js/chess.esm.js";

const UI = window.ChessOps.UI;
const game = new Chess();
const $ = id => document.getElementById(id);
let lastMove;

function dests() {
  const m = new Map();
  for (const mv of game.moves({ verbose: true })) { if (!m.has(mv.from)) m.set(mv.from, []); m.get(mv.from).push(mv.to); }
  return m;
}
function color() { return game.turn() === "w" ? "white" : "black"; }
function sync() {
  cg.set({
    fen: game.fen(), turnColor: color(), check: game.inCheck(), lastMove,
    movable: { color: "both", dests: dests() }
  });
  $("status").textContent = UI.statusText(game);
  $("moves").textContent = UI.movesText(game.history());
}

async function onMove(orig, dest) {
  const cands = game.moves({ square: orig, verbose: true }).filter(m => m.to === dest);
  if (!cands.length) { sync(); return; }
  let promotion;
  if (cands.some(m => m.promotion)) {
    promotion = await UI.askPromotion(game.turn());
    if (!promotion) { sync(); return; }                  // 取消升變：棋子彈返原位
  }
  const t0 = performance.now();
  game.move({ from: orig, to: dest, promotion });
  lastMove = [orig, dest];
  sync();
  $("perf").textContent = "最後一步處理時間：" + (performance.now() - t0).toFixed(1) + " ms";
}

const cg = Chessground($("board"), {
  fen: game.fen(), orientation: "white", turnColor: "white", coordinates: true,
  movable: { free: false, color: "both", dests: dests(), showDests: true, events: { after: onMove } },
  draggable: { enabled: true, showGhost: true, distance: 6 },
  selectable: { enabled: true },
  highlight: { lastMove: true, check: true },
  premovable: { enabled: false },
  animation: { enabled: true, duration: 180 }
});
sync();

$("flip").onclick = () => cg.toggleOrientation();
$("undo").onclick = () => { game.undo(); const h = game.history({ verbose: true }); const l = h[h.length - 1]; lastMove = l ? [l.from, l.to] : undefined; cg.setShapes([]); sync(); };
$("reset").onclick = () => { game.reset(); lastMove = undefined; cg.setShapes([]); sync(); };
$("promoPos").onclick = () => { game.load("8/P5k1/8/8/8/8/6K1/8 w - - 0 1"); lastMove = undefined; cg.setShapes([]); sync(); };
$("arrow").onclick = () => {
  const mv = game.moves({ verbose: true })[0];
  if (mv) cg.setShapes([{ orig: mv.from, dest: mv.to, brush: "green" }, { orig: "e4", brush: "red" }]);
};
</script>
</body>
</html>
